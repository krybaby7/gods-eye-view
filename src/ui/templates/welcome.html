<aside
  id="first-run-launcher"
  class="kit-panel"
  role="dialog"
  aria-labelledby="first-run-title"
  aria-describedby="first-run-description first-run-progress"
  hidden
>
  <p id="first-run-progress" hidden></p>
  <h2 id="first-run-title" class="kit-panel-title" tabindex="-1"></h2>
  <p id="first-run-description"></p>
  <div class="first-run-actions">
    <button type="button" class="kit-btn quiet" data-first-run-skip>Skip</button>
    <div class="first-run-navigation">
      <button type="button" class="kit-btn" data-first-run-back hidden>Back</button>
      <button type="button" class="kit-btn primary" data-first-run-next>Start tour</button>
    </div>
  </div>
</aside>
