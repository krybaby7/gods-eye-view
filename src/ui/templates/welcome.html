<!-- Explicit mission choice on a fresh session. Live feeds are not auto-enabled
       until the visitor asks; shared links skip this surface entirely. It returns
       every session until "Don't show this again" is ticked — see
       src/firstRunExperience.js for the full show policy. -->
<aside
  id="first-run-launcher"
  class="kit-panel"
  role="dialog"
  aria-labelledby="first-run-title"
  aria-describedby="first-run-description"
  hidden
>
  <header class="first-run-header">
    <span class="first-run-kicker">Mission control · first launch</span>
    <button
      type="button"
      class="kit-btn quiet search-layers-shortcut"
      data-open-search-layers
      aria-controls="searches-panel"
      hidden
    >
      Open Search Layers
    </button>
  </header>
  <h2 id="first-run-title" class="kit-panel-title">Choose your first view</h2>
  <!-- The card's one persuasive line, owner-authored and VERBATIM (2026-08-23)
         — including the unspaced em dash. The arc it has to carry: this looks
         like something you should not have access to → the sources are all
         public → the data is real. Tile subcopy stays purely functional. -->
  <p id="first-run-description">
    It feels like a forbidden cockpit—then you realize the sources are public
    and the data is real.
  </p>
  <div class="first-run-choices">
    <button type="button" class="kit-btn" data-first-run-choice="contacts">
      <svg
        class="first-run-icon"
        viewBox="0 0 20 20"
        aria-hidden="true"
        focusable="false"
      >
        <circle cx="10" cy="10" r="8" />
        <path d="M10 6a4 4 0 1 0 4 4m-4 0 5.5-5.5" />
        <circle cx="10" cy="10" r="0.8" />
      </svg>
      <span
        ><strong>Live contacts</strong
        ><small>Aircraft, vessels and nearby intelligence</small></span
      >
      <svg
        class="first-run-arrow"
        viewBox="0 0 20 20"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M4 10h11m-5-5 5 5-5 5" />
      </svg>
    </button>
    <button
      type="button"
      class="kit-btn"
      data-first-run-choice="space-missions"
    >
      <svg
        class="first-run-icon"
        viewBox="0 0 20 20"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M6 14C6 8 10 3 17 3c0 7-5 11-11 11Zm3-6-5 1-2 4 4 1m6-3-1 5-4 2-1-4m-1 3-2 2"
        />
        <circle cx="13" cy="7" r="1.5" />
      </svg>
      <span
        ><strong>Space missions</strong
        ><small>Launches, spacecraft and orbital context</small></span
      >
      <svg
        class="first-run-arrow"
        viewBox="0 0 20 20"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M4 10h11m-5-5 5 5-5 5" />
      </svg>
    </button>
    <button type="button" class="kit-btn" data-first-run-choice="environmental">
      <svg
        class="first-run-icon"
        viewBox="0 0 20 20"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M10 2c2 4 1 5 4 7 1-1 1-2 1-3 2 2 3 4 3 6a8 8 0 0 1-16 0c0-3 1-5 4-7 0 2 1 3 2 4 2-2 2-5 2-7Z"
        />
        <path d="M10 13c2 2 3 3 3 4a3 3 0 0 1-6 0c0-1 1-2 3-4Z" />
      </svg>
      <!-- Title text is painted from ENVIRONMENTAL_LABEL_CHOICE at init. -->
      <!-- Subcopy names BOTH feeds this tile turns on, because the launcher
             optimizes for the fully configured experience (owner ruling,
             2026-08-23) — see the mission table in src/firstRunExperience.js. -->
      <span
        ><strong data-first-run-environmental-title>Environmental</strong
        ><small
          >Live earthquakes and active fires, from USGS and NASA</small
        ></span
      >
      <svg
        class="first-run-arrow"
        viewBox="0 0 20 20"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M4 10h11m-5-5 5 5-5 5" />
      </svg>
    </button>
    <button
      type="button"
      class="first-run-explore kit-btn quiet"
      data-first-run-choice="explore"
    >
      <svg
        class="first-run-icon"
        viewBox="0 0 20 20"
        aria-hidden="true"
        focusable="false"
      >
        <circle cx="10" cy="10" r="8" />
        <ellipse cx="10" cy="10" rx="3.5" ry="8" />
        <path d="M2 10h16" />
      </svg>
      <span
        ><strong>Explore manually</strong
        ><small>Begin with a clean globe</small></span
      >
      <svg
        class="first-run-arrow"
        viewBox="0 0 20 20"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M4 10h11m-5-5 5 5-5 5" />
      </svg>
    </button>
  </div>
  <div class="first-run-footer">
    <label class="first-run-suppress">
      <input type="checkbox" data-first-run-suppress />
      <span>Don't show this again</span>
    </label>
    <span>Esc to dismiss</span>
  </div>
  <!-- Kept out of the footer row: it swaps to mission progress and errors, and
         a live region that also holds layout makes the row jump as it speaks. -->
  <p
    class="first-run-note kit-note"
    data-first-run-status
    role="status"
    aria-live="polite"
  >
    Use the microphone in the bottom bar to talk to the map.
  </p>
</aside>
